---
strategy: static
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
polling_url: ''
polling_headers: ''
name: Advent Calendar
description: ''
refresh_interval: 1440
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  description: A daily advent calendar from December 1 to 25, with a sleeping Santa the rest of the year.
  github_url: https://github.com/jterrace/trmnl-advent-calendar
